services:
  - type: web
    name: educonnect
    env: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Do not set a fixed PORT; Render provides the correct PORT at runtime.
      - key: DATABASE_URL
        fromDatabase:
          name: educonnect-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: educonnect-db
    databaseName: educonnect
    user: educonnect_user
    ipAllowList: []
