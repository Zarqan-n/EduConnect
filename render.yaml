services:
  - type: web
    name: educonnect
    env: node
    plan: free
    buildCommand: npm ci --include=dev && npm run db:push && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: educonnect-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: educonnect-db
    databaseName: educonnect
    user: educonnect_user
    plan: free
    ipAllowList: []
